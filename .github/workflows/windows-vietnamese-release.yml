name: Windows Vietnamese release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-vietnamese-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate Vietnamese release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-vi\.\d+$') { throw 'Expected a Vietnamese prerelease version.' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify language and Discord behavior
        run: npm run test:unit -- test/unit/i18n test/unit/discordPresence.test.ts test/unit/command-palette/commandRegistryContract.test.ts test/unit/settings/settingsNavModel.test.ts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/wallpaper-helper
      - name: Build wallpaper helper
        run: npm run build:wallpaper-helper
      - name: Build desktop frontend
        env:
          ELECTRON: 'true'
          APP_VERSION_LABEL: Vietnamese
        run: npm run build
      - name: Package Windows x64 installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never --config.publish.channel=latest
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v6
        with:
          name: folia-windows-vietnamese
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release/*.exe, release/*.blockmap, release/latest.yml, release/SHA256SUMS.txt | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Folia $env:RELEASE_TAG — Tiếng Việt" --notes-file .github/vietnamese-release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
